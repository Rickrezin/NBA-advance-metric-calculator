name: Sync secrets branch with main

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge main into secrets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout secrets
          if ! git merge origin/main -m "chore: sync secrets branch with main [automated]"; then
            echo "::error::Merge conflict detected. Please manually merge main into secrets to resolve conflicts."
            git merge --abort
            exit 1
          fi
          git push origin secrets
